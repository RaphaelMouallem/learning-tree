name: release

# Runs when you push a version tag such as v0.2.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python dev/test_learning_tree.py

      - name: Check the tag matches the skill version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SKILL_VERSION=$(grep -E '^[[:space:]]+version:' learning-tree/SKILL.md | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag: $TAG_VERSION, SKILL.md: $SKILL_VERSION"
          if [ "$TAG_VERSION" != "$SKILL_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match metadata.version in SKILL.md" >&2
            exit 1
          fi

      - name: Package
        run: bash dev/package.sh learning-tree.skill

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" learning-tree.skill --title "$GITHUB_REF_NAME" --generate-notes